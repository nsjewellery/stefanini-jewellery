title: Stefanini Jewellery
description: Handcrafted jewellery — a family-run atelier.
author: Stefanini Jewellery

url: https://stefaninijewellery.com
baseurl: ""

lang: en

languages: ["en", "it"]
default_lang: "en"
exclude_from_localization: ["media", "assets", "libs", ".github", "CLAUDE.md", "README.md"]

plugins:
  - jekyll-multiple-languages-plugin
  - jekyll-sitemap

social:
  instagram: "https://www.instagram.com/stefaninijewellery/"

business:
  name: "Stefanini Jewellery"
  email: "info@stefaninijewellery.com"
  summer_address:
    street: "Promenade du Port, Via Aga Khan 1"
    locality: "Porto Cervo"
    region: "Sardegna"
    postal_code: "07021"
    country: "IT"
  winter_address:
    street: "Palace Hotel"
    locality: "Gstaad"
    country: "CH"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
  - CLAUDE.md
  - stefani-jewerly.code-workspace
  - node_modules

keep_files:
  - assets
  - libs
  - media
